<body><div class="shell">
<header class="top"><div class="logo"><div class="mark">↗</div><div><strong>TRAINING LIBRARY</strong><small>Unified football training data</small></div></div><div class="actions"><span class="small muted" id="topstats">Loading collection…</span><button class="btn" id="openfile" type="button">Open JSON</button><input id="fileinput" class="file" type="file" accept=".json,.gz,.txt,application/json"/><a class="btn primary" href="./unified.json" download="unified.json" id="download">Download JSON</a></div></header>
<div class="main"><aside class="sidebar"><div class="filters"><p class="eyebrow">Explore the collection</p><h1>Training sessions</h1><p class="sub" id="collectionstats">Search, filter, and browse exercises</p><div class="searchwrap"><span class="searchicon">⌕</span><input id="search" class="search" type="search" placeholder="Search sessions or exercises…" aria-label="Search sessions or exercises"/></div><div class="chips" id="chips"></div></div><div class="count"><span id="found">0 sessions</span><span id="selectedkind"></span></div><div class="list" id="sessionlist"></div></aside><main class="viewer" id="viewer" aria-live="polite"><div class="landing"><h2>Your training collection</h2><p>Choose a session on the left to explore its exercise groups, instructions and diagrams.</p></div></main></div></div>
<script>
// The data lives in unified.json. Open JSON can load a local export too.
const EMBEDDED_GZIP = ''; // Dataset loaded from ./unified.json (single source of truth)
const $=id=>document.getElementById(id);
const state={data:null,all:[],filtered:[],current:null,category:'Alle',limit:45,search:'',urlToId:new Map()};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sanitizeHTML(raw){
 if(!raw)return '';
 const d=new DOMParser().parseFromString('<section>'+raw+'</section>','text/html');const root=d.body.firstElementChild;
 const allowed=new Set(['P','H1','H2','H3','H4','H5','H6','UL','OL','LI','B','STRONG','I','EM','U','BR','SPAN','A','BLOCKQUOTE']);
 function walk(n){if(n.nodeType===3)return document.createTextNode(n.textContent);if(n.nodeType!==1)return document.createTextNode('');if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','FORM','INPUT','LINK'].includes(n.tagName))return document.createTextNode('');let elem=document.createElement(allowed.has(n.tagName)?n.tagName.toLowerCase():'span');if(n.tagName==='A'){try{const u=new URL(n.getAttribute('href')||'',location.href);if(['http:','https:'].includes(u.protocol)){elem.setAttribute('href',u.href);elem.setAttribute('target','_blank');elem.setAttribute('rel','noopener noreferrer')}}catch(e){}}for(const child of n.childNodes)elem.appendChild(walk(child));return elem;}
 const out=document.createElement('div');for(const node of root.childNodes)out.appendChild(walk(node));return out.innerHTML;
}
function urlToImage(url){return url;}
function imageTag(url,klass,alt){if(!url)return `<div class="${klass}"></div>`;let local=urlToImage(url);let remote=url;return `<img class="${klass}" loading="lazy" alt="${escapeHTML(alt)}" src="${escapeHTML(local)}" data-remote="${escapeHTML(remote)}"/>`}
function activateImages(root){root.querySelectorAll('img[data-remote]').forEach(i=>{i.addEventListener('error',()=>{if(i.src!==i.dataset.remote){i.src=i.dataset.remote}else{i.style.opacity='.25'}},{once:false})})}
function categoryCount(c){return state.all.filter(x=>x.name===c).length}
function setup(data){if(!data||!Array.isArray(data.sessions)||!Array.isArray(data.texts)||!data.media_url_base)throw Error('Expected planr-unified-v1 with sessions, texts and media_url_base.');state.data=data;state.all=data.sessions;const dl=$('download');if(dl.dataset.blob)URL.revokeObjectURL(dl.dataset.blob);dl.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));dl.dataset.blob=dl.href;state.urlToId=new Map();for(const s of state.all)for(const g of s.exercise_groups||[])for(const e of g.exercises||[])for(const m of e.media||[])state.urlToId.set(data.media_url_base+m.url,m.image_id);
 state.all.forEach((s,i)=>{s._index=i;s._search=(s.name+' '+s.text+' '+s.exercise_groups.flatMap(g=>[g.label,g.text_ref==null?'':data.texts[g.text_ref],...g.exercises.flatMap(e=>[e.name,data.texts[e.text_ref]])]).join(' ')).replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').toLocaleLowerCase('de')});
 const total=state.all.reduce((n,s)=>n+s.exercise_groups.reduce((m,g)=>m+g.exercises.length,0),0);$('topstats').textContent=`${state.all.length} sessions · ${total} exercises`;$('collectionstats').textContent=`${state.all.length} sessions in ${new Set(state.all.map(s=>s.name)).size} categories`;
 const cats=[...new Set(state.all.map(s=>s.name))].sort((a,b)=>a.localeCompare(b,'de'));$('chips').innerHTML=['Alle',...cats].map(c=>`<button class="chip ${c==='Alle'?'active':''}" data-cat="${escapeHTML(c)}">${escapeHTML(c==='Alle'?`All (${state.all.length})`:`${c} (${categoryCount(c)})`)}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;state.limit=45;filter();});
 state.current=state.all[0]?.id_session;filter();if(state.all.length)show(state.all[0]);
}
function filter(){const q=state.search.trim().toLocaleLowerCase('de');state.filtered=state.all.filter(s=>(state.category==='Alle'||s.name===state.category)&&(!q||s._search.includes(q)));$('chips').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.cat===state.category));$('found').textContent=`${state.filtered.length} sessions`;$('selectedkind').textContent=state.category==='Alle'?'':state.category;drawList()}
function drawList(){let lim=state.filtered.slice(0,state.limit);$('sessionlist').innerHTML=lim.map(s=>`<button class="session ${s.id_session===state.current?'active':''}" data-id="${escapeHTML(s.id_session)}">${imageTag(s.preview_image,'thumb',s.name)}<span class="sess-right"><strong>${escapeHTML(s.name)}</strong><small>${s.exercise_groups.length} groups · ${s.exercise_groups.reduce((n,g)=>n+g.exercises.length,0)} exercises</small><span class="sid">#${String(s._index+1).padStart(3,'0')} · ${escapeHTML(s.id_session.slice(0,8))}</span></span></button>`).join('')+(state.filtered.length>state.limit?`<button id="loadmore" class="btn">Load more sessions</button>`:'')||'<div class="emptylist">No matching sessions. Try a different search.</div>';activateImages($('sessionlist'));$('sessionlist').querySelectorAll('.session').forEach(btn=>btn.onclick=()=>{let s=state.all.find(x=>x.id_session===btn.dataset.id);show(s);drawList()});if($('loadmore'))$('loadmore').onclick=()=>{state.limit+=45;drawList()}}
function range(v){if(!v||v.min==null||v.max==null)return '—';return v.min===v.max?String(v.min):v.min+'–'+v.max}
function show(s){if(!s)return;state.current=s.id_session;const d=state.data;let n=s.exercise_groups.reduce((sum,g)=>sum+g.exercises.length,0);
 let html=`<div class="crumb">Training collection / ${escapeHTML(s.name)}</div><div class="headline"><div><h2>${escapeHTML(s.name)} <span class="muted">#${String(s._index+1).padStart(3,'0')}</span></h2><div class="small muted">Session ID · ${escapeHTML(s.id_session)}</div></div><span class="tag">${n} exercises</span></div>`;
 html+=`<div class="intro"><div><div class="prose">${sanitizeHTML(s.text)}</div><div class="stats"><span class="stat"><b>Players</b> ${range(s.no_players)}</span><span class="stat"><b>Goalkeepers</b> ${range(s.goalkeeper)}</span><span class="stat"><b>Groups</b> ${s.exercise_groups.length}</span></div><p class="small muted">Published: ${escapeHTML(s.published_at||'—')}</p></div><div>${imageTag(s.preview_image,'introimg',s.name)}</div></div>`;
 for(let gi=0;gi<s.exercise_groups.length;gi++){const g=s.exercise_groups[gi];html+=`<section><div class="grouprow"><div class="groupname">${gi+1}. ${escapeHTML(g.label)}</div><div class="groupnum">${g.exercises.length} exercise${g.exercises.length===1?'':'s'}</div></div>`;if(g.text_ref!==undefined)html+=`<div class="prose">${sanitizeHTML(d.texts[g.text_ref])}</div>`;html+='<div class="grid">';for(const e of g.exercises){const first=e.media?.[0];let src=first?d.media_url_base+first.url:null;html+=`<article class="ex"><div class="exhead">${imageTag(src,'','Exercise diagram')}<div><h4>${escapeHTML(e.name)}</h4><div class="small muted">${e.media?.length||0} diagrams · ${range(e.no_players)} players</div></div></div><div class="exbody"><div class="prose">${sanitizeHTML(d.texts[e.text_ref])}</div><div class="metadata">${escapeHTML(e.id_exercise)}</div></div></article>`}html+='</div></section>'}
 html+=`<div class="footer">Original IDs and descriptions preserved. Diagram thumbnails are optimized WebP; source SVG links remain in the unified JSON. Source-file mappings and export failures are retained.</div>`;
 $('viewer').innerHTML=html;activateImages($('viewer'));if(window.innerWidth>=851)$('viewer').scrollTo(0,0);
}
async function unzip(bytes){const ds=new DecompressionStream('gzip');return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}
async function start(){try{let data;if(EMBEDDED_GZIP){const bytes=Uint8Array.from(atob(EMBEDDED_GZIP),x=>x.charCodeAt(0));data=JSON.parse(await unzip(bytes))}else{const res=await fetch('./unified.json');if(!res.ok)throw Error('Cannot load unified.json ('+res.status+'). You can still open your local file.');data=await res.json()}setup(data)}catch(err){$('viewer').innerHTML=`<div class="landing"><h2>Open your JSON collection</h2><p>${escapeHTML(err.message)}</p><p>Select <strong>Open JSON</strong> to load the optimized collection locally.</p></div>`;$('topstats').textContent='No collection loaded'}}
$('search').addEventListener('input',ev=>{state.search=ev.target.value;state.limit=45;if(state.data)filter()});$('openfile').onclick=()=>$('fileinput').click();$('fileinput').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{const bytes=await file.arrayBuffer();const str=file.name.endsWith('.gz')?await unzip(bytes):new TextDecoder().decode(bytes);setup(JSON.parse(str))}catch(err){alert('Could not load JSON: '+err.message)}};start();
</script><script>
/* Mobile navigation, collapsible instructions, zoom, and local JSON download. */
(function(){
 const mobile=()=>window.matchMedia('(max-width:850px)').matches;
 const viewer=document.getElementById('viewer');
 const top=document.querySelector('.top');
 let firstRender=true,resultsY=0;
 const adjustHeader=()=>document.documentElement.style.setProperty('--header-height',Math.ceil(top.getBoundingClientRect().height)+'px');
 adjustHeader();window.addEventListener('resize',adjustHeader,{passive:true});
 const dlg=document.createElement('dialog');dlg.className='zoom-dialog';
 dlg.innerHTML='<div class="zoom-top"><strong>Exercise diagram</strong><button type="button" aria-label="Close diagram">Close ✕</button></div><img alt="Enlarged exercise diagram">';
 document.body.appendChild(dlg);dlg.querySelector('button').onclick=()=>dlg.close();
 dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
 const baseShow=show;
 show=function(session){
   if(!session)return;
   if(mobile()&&firstRender===false&&!document.body.classList.contains('mobile-detail'))resultsY=window.scrollY;
   baseShow(session);
   const panels=Array.from(viewer.querySelectorAll(':scope > section'));
   panels.forEach((node,i)=>node.id='exercise-group-'+i);
   const toolbar=document.createElement('div');toolbar.className='mobile-toolbar';
   const back=document.createElement('button');back.type='button';back.className='mobile-back';back.textContent='← Sessions';back.setAttribute('aria-label','Back to session list');
   back.onclick=()=>{document.body.classList.remove('mobile-detail');requestAnimationFrame(()=>window.scrollTo(0,resultsY))};
   const label=document.createElement('label');label.className='mobile-jump';label.textContent='Group';
   const jump=document.createElement('select');jump.setAttribute('aria-label','Jump to exercise group');
   panels.forEach((panel,i)=>{const opt=document.createElement('option');opt.value=panel.id;const title=panel.querySelector('.groupname');opt.textContent=(i+1)+'. '+(title?title.textContent.trim():'Exercises');jump.appendChild(opt)});
   jump.onchange=()=>{const section=document.getElementById(jump.value);if(section)section.scrollIntoView({behavior:'smooth',block:'start'})};
   label.appendChild(jump);toolbar.appendChild(back);if(panels.length>1)toolbar.appendChild(label);
   viewer.insertBefore(toolbar,viewer.firstChild);
   panels.forEach(panel=>panel.style.scrollMarginTop='calc(var(--header-height) + 70px)');
   viewer.querySelectorAll('article.ex').forEach((card,i)=>{
     const content=card.querySelector('.exbody');if(!content)return;
     const toggle=document.createElement('button');toggle.type='button';toggle.className='exercise-toggle';toggle.setAttribute('aria-expanded','false');
     const toggleId='exercise-body-'+i;content.id=toggleId;toggle.setAttribute('aria-controls',toggleId);
     toggle.innerHTML='<span>Show instructions</span><span class="chevron" aria-hidden="true">⌄</span>';
     toggle.onclick=()=>{const open=card.classList.toggle('expanded');toggle.setAttribute('aria-expanded',String(open));toggle.firstElementChild.textContent=open?'Hide instructions':'Show instructions'};
     card.insertBefore(toggle,content);
     const img=card.querySelector('.exhead img');if(img){
       const btn=document.createElement('button');btn.type='button';btn.className='diagram-zoom';btn.setAttribute('aria-label','Enlarge exercise diagram');
       img.parentNode.insertBefore(btn,img);btn.appendChild(img);
       btn.onclick=()=>{dlg.querySelector('img').src=img.currentSrc||img.src;dlg.querySelector('img').alt=img.alt||'Exercise diagram';dlg.showModal()};
     }
   });
   if(mobile()){
     if(firstRender){document.body.classList.remove('mobile-detail')}else{document.body.classList.add('mobile-detail');window.scrollTo(0,0)}
   }
   firstRender=false;
 };
 // On small screens, render fewer session thumbnails per batch to limit work.
 const baseDrawList=drawList;
 drawList=function(){if(mobile()&&state.limit===45)state.limit=20;return baseDrawList()};
 const download=document.getElementById('download');
 download.addEventListener('click',e=>{
   if(!state.data)return;e.preventDefault();
   const blob=new Blob([JSON.stringify(state.data)],{type:'application/json'});
   const url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download='unified.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 });
})();
</script></body></html>
